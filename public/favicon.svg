<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#122640"/>
      <stop offset="60%" stop-color="#0a1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="22" y="22" width="468" height="468" rx="106" stroke="url(#borderGrad)" stroke-width="10" stroke-opacity="0.85"/>

  <!-- Subtle Medical Grid Lines -->
  <g stroke="#22d3ee" stroke-opacity="0.09" stroke-width="2">
    <line x1="128" y1="72" x2="128" y2="440"/>
    <line x1="256" y1="72" x2="256" y2="440"/>
    <line x1="384" y1="72" x2="384" y2="440"/>
    <line x1="72" y1="160" x2="440" y2="160"/>
    <line x1="72" y1="266" x2="440" y2="266"/>
    <line x1="72" y1="372" x2="440" y2="372"/>
  </g>

  <!-- Stylized Heart Emblem -->
  <path d="M256 402 C256 402 104 314 104 202 C104 146 148 106 198 106 C228 106 248 122 256 140 C264 122 284 106 314 106 C364 106 408 146 408 202 C408 314 256 402 256 402 Z"
        fill="url(#heartGrad)" stroke="#38bdf8" stroke-width="10" stroke-opacity="0.7" stroke-linejoin="round"/>

  <!-- Crisp Glowing ECG Waveform -->
  <path d="M74 266 L158 266 L184 218 L210 326 L246 142 L282 346 L310 236 L338 266 L438 266"
        stroke="url(#ecgGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Highlight Pulse Dot on R-Peak -->
  <circle cx="246" cy="142" r="18" fill="#fb7185" stroke="#ffffff" stroke-width="6"/>
</svg>
